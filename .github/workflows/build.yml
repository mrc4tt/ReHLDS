# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: C/C++ CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    types: [ opened, reopened, synchronize ]
  release:
    types: [ published ]
  workflow_dispatch:

# required for publishing releases and uploading artifacts
permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: debian:11-slim

    steps:
      - name: Install dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            gcc-multilib g++-multilib \
            build-essential \
            libc6-dev libc6-dev-i386 \
            git cmake rsync \
            g++ gcc \
            python3 \
            libarchive-zip-perl

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and Run unittests
        shell: bash
        run: |
          rm -rf build && cmake -DCMAKE_BUILD_TYPE=Unittests -B build && cmake --build build -j8
          retVal=0
          export LD_LIBRARY_PATH="rehlds/lib/linux32:$LD_LIBRARY_PATH"
          ./build/rehlds/engine_i486 2> /dev/null > result.log || retVal=$?
          while read -r line; do
            if [[ ${line} == *"Warning in test"* ]] ; then
              echo -e "\e[2;38m$line"
            elif [[ ${line} == *"Failure in test"* ]] ; then
              echo -e "\e[1;31m$line"
            else
              echo -e "\e[0;33m$line"
            fi
          done <<< "$(cat result.log)"

          if [ $retVal -ne 0 ] && [ $retVal -ne 3 ]; then
            echo -e "\e[30;41mExit code: $retVal\e[0m"
            exit 1 # Unittest failed
          else
            echo -e "\e[30;43mExit code: $retVal\e[0m"
          fi

      - name: Build using GCC Compiler
        run: |
          rm -rf build && cmake -B build && cmake --build build -j8

      - name: Prepare HLSDK
        run: |
          mkdir -p publish/hlsdk
          rsync -a rehlds/common/ publish/hlsdk/common/
          rsync -a rehlds/dlls/ publish/hlsdk/dlls/
          rsync -a rehlds/pm_shared/ publish/hlsdk/pm_shared/
          rsync -a rehlds/public/ publish/hlsdk/public/ --exclude rehlds/
          rsync -a rehlds/public/rehlds/ publish/hlsdk/engine

      - name: Move files
        run: |
          mkdir -p publish/bin/linux32/valve/dlls
          mv rehlds/lib/linux32/libsteam_api.so publish/bin/linux32/libsteam_api.so
          mv build/rehlds/engine_i486.so publish/bin/linux32/engine_i486.so
          mv rehlds/version/appversion.h publish/appversion.h
          mv build/rehlds/dedicated/hlds_linux publish/bin/linux32/hlds_linux
          mv build/rehlds/HLTV/Console/hltv publish/bin/linux32/hltv
          mv build/rehlds/HLTV/Core/core.so publish/bin/linux32/core.so
          mv build/rehlds/HLTV/Proxy/proxy.so publish/bin/linux32/proxy.so
          mv build/rehlds/HLTV/DemoPlayer/demoplayer.so publish/bin/linux32/demoplayer.so
          mv build/rehlds/HLTV/Director/director.so publish/bin/linux32/valve/dlls/director.so
          mv build/rehlds/filesystem/FileSystem_Stdio/filesystem_stdio.so publish/bin/linux32/filesystem_stdio.so

      - name: Compute and bundle engine CRC
        shell: bash
        run: |
          cd publish/bin/linux32
          CRC=$(crc32 engine_i486.so | tr '[:lower:]' '[:upper:]')
          echo "$CRC  engine_i486.so" > engine_i486.so.crc
          echo "Bundled engine CRC: $CRC"

      - name: Run GLIBC/ABI version compat test
        shell: bash
        run: |
          binaries=(
            "publish/bin/linux32/engine_i486.so"
            "publish/bin/linux32/hlds_linux"
            "publish/bin/linux32/hltv"
            "publish/bin/linux32/core.so"
            "publish/bin/linux32/proxy.so"
            "publish/bin/linux32/demoplayer.so"
            "publish/bin/linux32/valve/dlls/director.so"
            "publish/bin/linux32/filesystem_stdio.so"
          )
          bash ./rehlds/version/glibc_test.sh "${binaries[@]}"
          if [[ $? -ne 0 ]]; then
            exit 1 # Assertion failed
          fi

      - name: Deploy artifacts
        id: upload-job
        uses: actions/upload-artifact@v4
        with:
          name: linux32-rehlds
          path: publish/*

  update-amxmodx-crc:
    name: 'Update AMX MOD X CRC'
    runs-on: ubuntu-latest
    needs: [linux]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32-rehlds
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-zip-perl jq
      
      - name: Calculate CRC32 checksum
        id: crc
        run: |
          if [ ! -f "bin/linux32/engine_i486.so" ]; then
            echo "Error: engine_i486.so not found!"
            exit 1
          fi
          
          # Calculate CRC32
          CRC32=$(crc32 bin/linux32/engine_i486.so)
          echo "CRC32 checksum: $CRC32"
          
          # Convert to uppercase hex format
          CRC32_HEX=$(echo "$CRC32" | tr '[:lower:]' '[:upper:]')
          echo "crc32_hex=$CRC32_HEX" >> $GITHUB_OUTPUT
          echo "CRC32 HEX: $CRC32_HEX"
          
          # Display file info
          ls -lh bin/linux32/engine_i486.so
      
      - name: Checkout AMX MOD X fork
        uses: actions/checkout@v4
        with:
          repository: mrc4tt/amxmodx
          token: ${{ secrets.AMXMODX_PAT }}
          path: amxmodx-repo
      
      - name: Update game.cstrike.txt with new engine CRC
        id: update
        run: |
          cd amxmodx-repo
          FILE="gamedata/modules.games/game.cstrike.txt"
          CRC32_HEX="${{ steps.crc.outputs.crc32_hex }}"

          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE not found in AMX MOD X repo!"
            exit 1
          fi

          echo "Original file content (server section):"
          sed -n '/"server"/,/^[[:space:]]*"[^"]*"[[:space:]]*$/p' "$FILE" | head -20

          cp "$FILE" "$FILE.bak"

          python3 - <<'PYCODE'
          import re, pathlib

          path = pathlib.Path("gamedata/modules.games/game.cstrike.txt")
          text = path.read_text()
          crc = "${{ steps.crc.outputs.crc32_hex }}"

          # Find the top-level CRC block. Use a brace-balanced scan so nested
          # braces inside the block don't terminate the match early.
          crc_header = re.search(r'"CRC"\s*\{', text)
          if not crc_header:
              raise SystemExit("CRC block not found")

          body_start = crc_header.end()
          depth = 1
          i = body_start
          while i < len(text) and depth > 0:
              c = text[i]
              if c == '{':
                  depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0:
                      break
              i += 1
          if depth != 0:
              raise SystemExit("Unbalanced braces in CRC block")
          body_end = i  # index of the closing '}'

          block_body = text[body_start:body_end]

          # Detect indent of the CRC block's closing brace (a stable reference,
          # since first-line indent inside the body may be corrupted by prior runs)
          # and add one tab for child blocks.
          line_start = text.rfind('\n', 0, body_end) + 1
          crc_indent = re.match(r'[ \t]*', text[line_start:body_end]).group(0)
          indent = crc_indent + "\t"

          # Strip ALL existing "engine" { ... } sub-blocks. We match starting
          # at the line itself (the leading newline is preserved so the
          # surrounding structure stays intact). Repeated runs of the old
          # script stacked these blocks, so this run normalizes them away.
          def strip_engine_blocks(s: str) -> str:
              out = []
              j = 0
              pat = re.compile(r'^[ \t]*"engine"\s*\{', re.M)
              while True:
                  m = pat.search(s, j)
                  if not m:
                      out.append(s[j:])
                      break
                  out.append(s[j:m.start()])
                  k = m.end()
                  d = 1
                  while k < len(s) and d > 0:
                      if s[k] == '{':
                          d += 1
                      elif s[k] == '}':
                          d -= 1
                      k += 1
                  # consume the rest of the line (any trailing whitespace + newline)
                  while k < len(s) and s[k] in ' \t':
                      k += 1
                  if k < len(s) and s[k] == '\n':
                      k += 1
                  j = k
              return ''.join(out)

          cleaned_body = strip_engine_blocks(block_body)
          # Strip any orphan AUTO-GENERATED marker comment lines left behind
          # from a previous run (the engine block they preceded was just removed
          # above; the marker line itself is not part of the block scan).
          cleaned_body = re.sub(
              r'^[ \t]*//\s*AUTO-GENERATED by ReHLDS CI[^\n]*\n',
              '',
              cleaned_body,
              flags=re.M,
          )

          # Build a single fresh engine block (own line, with trailing newline).
          # Marker comment warns humans not to hand-edit; ReHLDS CI overwrites
          # this block on every build.
          engine_block = (
              f'{indent}// AUTO-GENERATED by ReHLDS CI - DO NOT EDIT MANUALLY\n'
              f'{indent}"engine"\n'
              f'{indent}{{\n'
              f'{indent}\t"linux" "{crc}" // engine_i486.so\n'
              f'{indent}}}\n'
          )

          # Insert before "server" if present, otherwise at the top of the body.
          server_match = re.search(r'^[ \t]*"server"\s*\{', cleaned_body, re.M)
          if server_match:
              insert_at = server_match.start()
              new_body = cleaned_body[:insert_at] + engine_block + cleaned_body[insert_at:]
          else:
              # Make sure body starts with a newline so the block sits on its own line
              prefix = '' if cleaned_body.startswith('\n') else '\n'
              new_body = prefix + engine_block + cleaned_body.lstrip('\n')

          # Collapse runs of blank lines that may accumulate from prior cruft.
          new_body = re.sub(r'\n{3,}', '\n\n', new_body)

          new_text = text[:body_start] + new_body + text[body_end:]
          path.write_text(new_text)
          print("Engine CRC normalized: all prior engine blocks removed, one fresh block inserted")
          PYCODE

          echo ""
          echo "Updated file content (server section):"
          sed -n '/"server"/,/^[[:space:]]*"[^"]*"[[:space:]]*$/p' "$FILE" | head -20

          if diff "$FILE.bak" "$FILE" > /dev/null; then
            echo "No changes detected in $FILE"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "File successfully updated!"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          rm "$FILE.bak"
      
      - name: Commit and push changes to AMX MOD X
        if: steps.update.outputs.changed == 'true'
        run: |
          cd amxmodx-repo

          git config user.name "ReHLDS Build Bot"
          git config user.email "actions@github.com"

          git add gamedata/modules.games/game.cstrike.txt

          BUILD_NR="${{ github.run_number }}"
          CRC32_HEX="${{ steps.crc.outputs.crc32_hex }}"
          REHLDS_SHA="${{ github.sha }}"

          git commit -m "chore: Update engine CRC from ReHLDS build ${BUILD_NR} - Engine: ${CRC32_HEX}

          Source: ReHLDS ${REHLDS_SHA}
          Auto-generated by .github/workflows/build.yml. Do not hand-edit
          the \"engine\" CRC block in game.cstrike.txt - it is overwritten
          on every ReHLDS master build."
          git push

      - name: Verify pushed CRC is live on amxmodx default branch
        if: steps.update.outputs.changed == 'true'
        run: |
          cd amxmodx-repo
          CRC32_HEX="${{ steps.crc.outputs.crc32_hex }}"
          # Re-fetch from origin to confirm the push landed and was not
          # immediately reverted by a concurrent push.
          git fetch origin
          DEFAULT_BRANCH=$(git remote show origin | sed -n 's|.*HEAD branch: ||p')
          REMOTE_CRC=$(git show "origin/${DEFAULT_BRANCH}:gamedata/modules.games/game.cstrike.txt" \
            | python3 -c "
          import re, sys
          text = sys.stdin.read()
          m = re.search(r'\"engine\"\s*\{[^}]*\"linux\"\s*\"([0-9A-Fa-f]+)\"', text)
          print(m.group(1).upper() if m else 'NONE')
          ")
          echo "Local CRC32:  ${CRC32_HEX}"
          echo "Remote CRC32: ${REMOTE_CRC}"
          if [ "${REMOTE_CRC}" != "${CRC32_HEX}" ]; then
            echo "::error::amxmodx ${DEFAULT_BRANCH} CRC (${REMOTE_CRC}) does not match this build's CRC (${CRC32_HEX}) after push. A concurrent commit may have reverted the auto-update."
            exit 1
          fi
          echo "Verified: amxmodx ${DEFAULT_BRANCH} carries CRC ${CRC32_HEX}."

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [ linux ]

    steps:
      - name: Deploying linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32-rehlds

      - name: Reading appversion.h
        run: |
          if [ -e appversion.h ]; then
            APP_VERSION=$(grep -wi '#define APP_VERSION_STRD' appversion.h | sed -e 's/#define APP_VERSION_STRD[ \t\r\n\v\f]\+\(.*\)/\1/i' -e 's/\r//g')
            if [ $? -ne 0 ]; then
              APP_VERSION=""
            else
              APP_VERSION=$(echo "$APP_VERSION" | xargs) # trim & remove quotes
              echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
            fi
          fi
          rm -f appversion.h

      - name: Packaging bin
        id: packaging-job
        shell: bash
        run: |
          # Pack and try sign final archive
          7z a -tzip "rehlds-bin-${{ env.APP_VERSION }}.zip" bin/ hlsdk/

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-ci-${{ env.APP_VERSION }}
          path: |
            *.zip
            *.7z
            *.asc

      - name: Release artifacts
        id: publish-job
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          steps.packaging-job.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.7z
            *.asc
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
